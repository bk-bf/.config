###### osync - Rsync based two way sync engine with fault tolerance
###### (C) 2013-2023 by Orsiris de Jong (www.netpower.fr)
###### Config: sync ~/Documents/remote (laptop)  <->  ubuntuserver:~/Documents/remote

[GENERAL]
CONFIG_FILE_REVISION=1.3.0

## Sync job identification
INSTANCE_ID="documents_remote"

## Directories to synchronize.
## Initiator is this laptop; target is ubuntuserver over Tailscale.
INITIATOR_SYNC_DIR="/home/kirill/Documents/remote"
## Host is the 'ubuntu' SSH alias (~/.ssh/config, not in this repo) so no tailnet
## IP/DNS is published here; the alias resolves to the pinned Tailscale IP, which
## also dodges flaky MagicDNS. Double slash => absolute remote path.
TARGET_SYNC_DIR="ssh://ubuntu@ubuntu:22//home/ubuntu/Documents/remote"

## Only an ed25519 key exists on this host; osync's id_rsa default would fail.
SSH_RSA_PRIVATE_KEY="/home/kirill/.ssh/id_ed25519"

SSH_PASSWORD_FILE=""

## Only used when ssh_filter.sh restricts the remote key (not the case here).
_REMOTE_TOKEN=SomeAlphaNumericToken9

## Create sync dirs (and remote ~/Documents/remote) if missing.
CREATE_DIRS=true

## /var/log isn't user-writable; keep the log in the user cache.
LOGFILE="/home/kirill/.cache/osync/documents_remote.log"

MINIMUM_SPACE=10240
BANDWIDTH=0

SUDO_EXEC=false
RSYNC_EXECUTABLE=rsync
RSYNC_REMOTE_PATH=""

RSYNC_PATTERN_FIRST=include
RSYNC_INCLUDE_PATTERN=""
## Never sync VCS metadata, dependency trees, or build output. A .git dir is
## thousands of small loose objects — the file COUNT, not the byte size, is what
## makes rsync's delta pass expensive. Moving the notes vault here added 197MB
## of .git; excluding it keeps that class of mistake from mattering again.
## .smart-env is the Obsidian Smart Connections embedding store inside the notes
## vault: 28MB over 172 files, rewritten whenever a note changes, and rebuilt
## from the notes themselves on any machine that needs it.
## .osync-part is the in-flight chunk directory named by --partial-dir below.
## rsync adds an implied exclude for a relative --partial-dir, but only on the
## invocations that actually carry the flag; osync's attribute-update pass
## (osync.sh:4281-4286) builds its command from RSYNC_ATTR_ARGS instead of
## RSYNC_DEFAULT_ARGS and so never sees it. Name it here as well so the chunk
## directory is invisible on every code path, not most of them.
RSYNC_EXCLUDE_PATTERN=".git;.svn;.hg;node_modules;__pycache__;.venv;venv;target;dist;build;.cache;.mypy_cache;.pytest_cache;.smart-env;.DS_Store;*.pyc;*.swp;*.tmp;*.part;.osync-part"
RSYNC_INCLUDE_FROM=""
RSYNC_EXCLUDE_FROM=""
PATH_SEPARATOR_CHAR=";"

INITIATOR_CUSTOM_STATE_DIR=""
TARGET_CUSTOM_STATE_DIR=""

[REMOTE_OPTIONS]

## Link is already encrypted+compressed by WireGuard/Tailscale.
SSH_COMPRESSION=false
SSH_IGNORE_KNOWN_HOSTS=false
SSH_CONTROLMASTER=false
REMOTE_HOST_PING=false
REMOTE_3RD_PARTY_HOSTS=""

[MISC_OPTIONS]

## Ported from yeet's transport (osd/yeet:232 — `rsync -aH --partial
## --partial-dir=../.yeet-part`). Without --partial, rsync DISCARDS a
## partially-transferred file and restarts it from zero on the next run. This
## tree holds a 74MB PDF, a 60MB PDF and a 33MB wav; on a laptop that suspends
## mid-transfer over Tailscale, a big file can be re-sent from scratch forever
## and never land. --partial-dir keeps in-flight chunks out of the destination
## so an interrupted run never leaves something that looks like a finished file.
## --timeout kills a stalled connection instead of burning the exec-time budget.
RSYNC_OPTIONAL_ARGS="--partial --partial-dir=.osync-part --timeout=120"

PRESERVE_PERMISSIONS=true
## Local files span users (incl. a root-owned file) and remote runs as 'ubuntu';
## preserving owner/group would require sudo on the target, so leave them off.
PRESERVE_OWNER=false
PRESERVE_GROUP=false
PRESERVE_EXECUTABILITY=true
PRESERVE_ACL=false
PRESERVE_XATTR=false
COPY_SYMLINKS=false
KEEP_DIRLINKS=false
PRESERVE_HARDLINKS=false
CHECKSUM=false

RSYNC_COMPRESS=true

## These are per-phase, not per-run: osync passes them to every ExecTasks call
## (tree list, delete list, attr sync, update, tree list after), so 10600 is up
## to ~3h of wedge per phase while the replica lock is held and the 5-minute
## timer keeps firing into it. 463MB over Tailscale is minutes, not hours. With
## --timeout=120 a dead link now dies in two minutes, so these only have to be a
## backstop against a live-but-crawling link, and a stuck phase getting killed
## costs nothing: RESUME_SYNC picks up next run and --partial keeps the chunks.
SOFT_MAX_EXEC_TIME=1800
HARD_MAX_EXEC_TIME=3600
KEEP_LOGGING=1801
MIN_WAIT=60
MAX_WAIT=7200

[BACKUP_DELETE_OPTIONS]

LOG_CONFLICTS=false
ALERT_CONFLICTS=false
## Keep a backup on the side that gets overwritten (.osync_workdir/backups).
CONFLICT_BACKUP=true
CONFLICT_BACKUP_MULTIPLE=false
CONFLICT_BACKUP_DAYS=30
## On a same-timestamp-but-differing conflict, the laptop copy wins.
CONFLICT_PREVALANCE=initiator

## Deleted files are retained under .osync_workdir/deleted for 30 days.
SOFT_DELETE=true
SOFT_DELETE_DAYS=30

SKIP_DELETION=
## Bidirectional sync (osync default).
SYNC_TYPE=

[RESUME_OPTIONS]

RESUME_SYNC=true
RESUME_TRY=2
FORCE_STRANGER_LOCK_RESUME=false
PARTIAL=false
DELTA_COPIES=true

[ALERT_OPTIONS]
DESTINATION_MAILS=""
ALWAYS_SEND_MAILS=false
MAIL_BODY_CHARSET=""
SENDER_MAIL="alert@your.system.tld"
SMTP_SERVER=smtp.your.isp.tld
SMTP_PORT=25
SMTP_ENCRYPTION=none
SMTP_USER=
SMTP_PASSWORD=

[EXECUTION_HOOKS]

LOCAL_RUN_BEFORE_CMD=""
LOCAL_RUN_AFTER_CMD=""
REMOTE_RUN_BEFORE_CMD=""
REMOTE_RUN_AFTER_CMD=""
MAX_EXEC_TIME_PER_CMD_BEFORE=0
MAX_EXEC_TIME_PER_CMD_AFTER=0
STOP_ON_CMD_ERROR=true
RUN_AFTER_CMD_ON_ERROR=false
