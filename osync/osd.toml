# osd compose — one file, many sync connections.
# Managed by osd (a add · t endpoint · d direction), editable by hand.
# Each [[connection]] is a two-way osync job between this machine and a host.

[settings]
notify = false
notify_cmd = "notify-send"
delete_guard = 25
node = "cachyos-x8664"
yeet_hub = "ubuntu"

[defaults]
user = "kirill"
key = "~/.ssh/id_ed25519"
soft_delete_days = 30
conflict_backup_days = 30

[[connection]]
name = "documents_remote"
local = "/home/kirill/Documents/remote"
remote = "/home/ubuntu/Documents/remote"
direction = "send"
mode = "ts"
user = "ubuntu"
key = "/home/kirill/.ssh/id_ed25519"
ts_host = "ubuntu"
ts_port = 22
ssh_host = ""
ssh_port = 22
exclude = ".git;.svn;.hg;node_modules;__pycache__;.venv;venv;target;dist;build;.cache;.mypy_cache;.pytest_cache;.smart-env;.DS_Store;*.pyc;*.swp;*.tmp;*.part;.osync-part"
auto = "periodic"
interval = "5m"

[[connection]]
name = "memory-universal"
local = "/home/kirill/memory-universal"
remote = "/home/ubuntu/memory-universal"
direction = "sync"
mode = "ts"
user = "ubuntu"
key = "/home/kirill/.ssh/id_ed25519"
ts_host = "ubuntu"
ts_port = 22
ssh_host = ""
ssh_port = 22
exclude = ".osync-part;.DS_Store;*.tmp;*.swp;*.part"
auto = "periodic"
interval = "5m"
