###### osync configuration — generated by osync-dash
###### two-way sync: /home/kirill/.claude/projects  <->  ubuntu@ubuntu:/home/ubuntu/claude-code-sessions

[GENERAL]
CONFIG_FILE_REVISION=1.3.0
INSTANCE_ID="claude-sessions-laptop"
INITIATOR_SYNC_DIR="/home/kirill/.claude/projects"
TARGET_SYNC_DIR="ssh://ubuntu@ubuntu:22//home/ubuntu/claude-code-sessions"
SSH_RSA_PRIVATE_KEY="/home/kirill/.ssh/id_ed25519"
SSH_PASSWORD_FILE=""
_REMOTE_TOKEN=SomeAlphaNumericToken9
CREATE_DIRS=true
LOGFILE="/home/kirill/.cache/osync/claude-sessions-laptop.log"
MINIMUM_SPACE=10240
BANDWIDTH=0
SUDO_EXEC=false
RSYNC_EXECUTABLE=rsync
RSYNC_REMOTE_PATH=""
RSYNC_PATTERN_FIRST=include
RSYNC_INCLUDE_PATTERN=""
## .hidden-sessions.json and bridge-pointer.json are per-machine state, not
## session history: the first is one machine's hidden-session list, the second
## carries a live pid and environment id that mean nothing on another host.
## The Einbürgerung transcript is 77MB because the claude.ai bridge re-downloads
## its pasted PDFs every cycle; ~/.claude/projects/.gitignore already keeps it
## out of the git mirror for exactly that reason, so keep it out of here too.
## Leading slash anchors to the replica root; the sibling tool-results/ dir of
## the same name is not matched and still syncs.
RSYNC_EXCLUDE_PATTERN=".osync-part;.DS_Store;*.tmp;*.swp;*.part;.hidden-sessions.json;bridge-pointer.json;/-home-kirill-Documents-Personal-Documents-Einb-rgerung/9694fe51-baf7-4863-b3a8-122738bda63e.jsonl"
RSYNC_INCLUDE_FROM=""
RSYNC_EXCLUDE_FROM=""
PATH_SEPARATOR_CHAR=";"
INITIATOR_CUSTOM_STATE_DIR=""
TARGET_CUSTOM_STATE_DIR=""

## osync-dash: endpoint bookkeeping (ignored by osync). Mode ts|ssh|both;
## in 'both', osync-dash prefers Tailscale and falls back to SSH.
DASH_TARGET_USER="ubuntu"
DASH_TARGET_PATH="/home/ubuntu/claude-code-sessions"
DASH_TS_HOST="ubuntu"
DASH_TS_PORT="22"
DASH_SSH_HOST=""
DASH_SSH_PORT="22"
DASH_ENDPOINT_MODE="ts"

[REMOTE_OPTIONS]
SSH_COMPRESSION=false
SSH_IGNORE_KNOWN_HOSTS=false
SSH_CONTROLMASTER=false
REMOTE_HOST_PING=false
REMOTE_3RD_PARTY_HOSTS=""

[MISC_OPTIONS]
## Same treatment as documents-remote. "Many small JSONL files" is not what this
## replica actually is: 576MB over 1003 files, with single transcripts at 28MB,
## 23MB and 23MB once the 77MB one above is excluded. Transcripts are appended
## to, so steady state is a small delta, but the *first* transfer of a 28MB file
## is the case that has to survive a suspend — and it fires against a 1-minute
## timer, so it gets interrupted more often than the 5-minute job does, not less.
## --partial-dir costs nothing when nothing is interrupted: rsync only creates
## the directory when it has a chunk to park. A chunk left from an earlier,
## shorter version of an appended file is a valid delta basis, and rsync
## verifies the whole-file checksum before putting the result in place.
RSYNC_OPTIONAL_ARGS="--partial --partial-dir=.osync-part --timeout=120"
PRESERVE_PERMISSIONS=true
## owner/group off: replicas usually run as different users, and preserving
## them needs sudo on the target. Flip to true if both sides share the user.
PRESERVE_OWNER=false
PRESERVE_GROUP=false
PRESERVE_EXECUTABILITY=true
PRESERVE_ACL=false
PRESERVE_XATTR=false
COPY_SYMLINKS=false
KEEP_DIRLINKS=false
PRESERVE_HARDLINKS=false
CHECKSUM=false
RSYNC_COMPRESS=true
## Per-phase, not per-run. A 1-minute timer with a ~3h ceiling per phase means a
## wedged run can hold the replica lock across ~180 scheduled syncs. Kept lower
## than documents-remote's to match the cadence.
SOFT_MAX_EXEC_TIME=900
HARD_MAX_EXEC_TIME=2700
KEEP_LOGGING=1801
MIN_WAIT=60
MAX_WAIT=7200

[BACKUP_DELETE_OPTIONS]
LOG_CONFLICTS=false
ALERT_CONFLICTS=false
CONFLICT_BACKUP=true
CONFLICT_BACKUP_MULTIPLE=false
CONFLICT_BACKUP_DAYS=30
CONFLICT_PREVALANCE=initiator
SOFT_DELETE=true
SOFT_DELETE_DAYS=30
SKIP_DELETION=
SYNC_TYPE=

[RESUME_OPTIONS]
RESUME_SYNC=true
RESUME_TRY=2
FORCE_STRANGER_LOCK_RESUME=false
PARTIAL=false
DELTA_COPIES=true

[ALERT_OPTIONS]
DESTINATION_MAILS=""
ALWAYS_SEND_MAILS=false
MAIL_BODY_CHARSET=""
SENDER_MAIL="alert@your.system.tld"
SMTP_SERVER=smtp.your.isp.tld
SMTP_PORT=25
SMTP_ENCRYPTION=none
SMTP_USER=
SMTP_PASSWORD=

[EXECUTION_HOOKS]
LOCAL_RUN_BEFORE_CMD=""
LOCAL_RUN_AFTER_CMD=""
REMOTE_RUN_BEFORE_CMD=""
REMOTE_RUN_AFTER_CMD=""
MAX_EXEC_TIME_PER_CMD_BEFORE=0
MAX_EXEC_TIME_PER_CMD_AFTER=0
STOP_ON_CMD_ERROR=true
RUN_AFTER_CMD_ON_ERROR=false
