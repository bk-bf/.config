# Theme
include current-theme.conf

# Fonts
font_family      SauceCodePro Nerd Font
bold_font        SauceCodePro Nerd Font Bold
italic_font      SauceCodePro Nerd Font Italic
bold_italic_font SauceCodePro Nerd Font Bold Italic
symbol_map U+0400-U+04FF DejaVu Sans Mono
font_size 11.5
adjust_line_height  0
adjust_column_width 0

# Cursor & scrollback
cursor_shape beam
scrollback_lines 2000

# URLs
url_style single

# Bell
enable_audio_bell yes

# Layout & window
enabled_layouts splits
window_margin_width 10.0
hide_window_decorations yes
confirm_os_window_close 0
close_on_child_death no
window_border_width 0
draw_minimal_borders yes

# Remote control
allow_remote_control yes
listen_on unix:/tmp/kitty.sock

# Keybinds
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map alt+h launch --location=hsplit --cwd=current
map alt+v launch --location=vsplit --cwd=current
map alt+q close_window

# Free ctrl+shift+v (kitty's second paste) and ctrl+shift+h (scrollback popup)
# so they pass through to herdr's split_vertical / split_horizontal bindings
map ctrl+shift+v
map ctrl+shift+h

# Free ctrl+tab / ctrl+shift+tab (kitty's next_tab / previous_tab defaults)
# so they pass through to herdr's next_tab / previous_tab bindings
map ctrl+tab
map ctrl+shift+tab
