# Survive an OOM kill inside the session instead of tearing the desktop down.
#
# systemd's default OOMPolicy for a service is "stop": if the kernel OOM killer
# kills ANY process in this unit's cgroup, systemd stops the entire unit. Since
# every app launched by the compositor lives in this cgroup, one runaway process
# being killed took the whole Hyprland session with it (and bounced back to SDDM).
#
# "continue" keeps the unit running and lets the OOM killer do its job on the one
# process that actually misbehaved.
#
# Deliberately NOT setting OOMScoreAdjust here: it is inherited by every child
# process, so a protective value would make all GUI apps in the session
# near-unkillable and push the OOM killer toward system daemons instead.
[Service]
OOMPolicy=continue
