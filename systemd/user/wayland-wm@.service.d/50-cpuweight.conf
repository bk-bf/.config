# Give the compositor priority over dev workloads under CPU contention.
#
# This cgroup holds Hyprland itself plus every app it spawns directly, so it is
# the unit that must not lose the race for CPU when background test runs saturate
# the cores. At 120Hz the per-frame budget is 8.3ms; missing it drops frames
# regardless of how healthy video decode is.
#
# Paired with app-code-.scope.d/50-cpuweight.conf (dev work at 20). Weights are
# proportional and only apply under contention — this costs nothing on an idle box.
#
# Note: scx_lavd (sched_ext) is the active scheduler and already biases toward
# latency-sensitive tasks. This is a coarser, explicit backstop for the case lavd
# cannot resolve on its own: many CPU-bound workers all wanting cores at once.
[Service]
CPUWeight=300
