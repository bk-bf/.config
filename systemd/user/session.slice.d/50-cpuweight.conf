# Raise the desktop session above app workloads under CPU contention.
#
# Why this file is needed even though app-code-*.scope is already CPUWeight=20:
# cgroup weights are only meaningful BETWEEN SIBLINGS. app-code sits in app.slice,
# and the only other app.slice members are idle dbus daemons — so under contention
# app.slice still wins its full share at the top level and VS Code consumes nearly
# all of it. The internal weight of 20 does almost nothing on its own.
#
# The decision therefore has to be made one level up, between app.slice (100) and
# session.slice. At 300 vs 100 the session takes ~75% under contention instead of
# ~50%, which is what protects the compositor's 8.3ms frame budget at 120Hz.
#
# session.slice holds the compositor, pipewire/wireplumber, the portals and dbus —
# all latency-sensitive and none of them CPU-hungry when idle, so a high weight
# here costs nothing and is never a cap.
#
# The layered result under contention:
#   session.slice 300  ── compositor 300, terminals 100
#   app.slice     100  ── Zen 100 vs VS Code 20  (5:1 in Zen's favour)
#
# Zen normally lands in app.slice as app-zen-<pid>.scope, so the 100-vs-20 split
# is what puts entertainment ahead of dev work; this file puts the compositor
# ahead of both.
[Slice]
CPUWeight=300
