# Graceful memory relief for the Hyprland session (all GUI apps live here).
# MemoryHigh is a SOFT cap: when the session exceeds it, the kernel reclaims
# cold pages into zram (compressed) and throttles if needed -- it never kills a
# process. Raise the value if apps feel throttled; lower it to reclaim sooner.
[Slice]
MemoryHigh=11G
