# Memory PROTECTION for the desktop session — not a cap.
#
# This file previously set MemoryHigh=11G, which was backwards. MemoryHigh is a
# soft CAP: it throttles the cgroup it is applied to. Applied to session.slice it
# throttled the compositor, browser and terminals — exactly the things that must
# stay responsive — while app.slice (VS Code, test runners) was uncapped at the
# slice level. Under pressure the reclaim landed on the desktop. session.slice was
# sitting at 7.2G against that 11G ceiling, so it was within reach in normal use.
#
# MemoryLow is the actual priority lever, and the memory-side counterpart of
# CPUWeight in 50-cpuweight.conf: pages below this line are protected from reclaim,
# so the kernel takes memory from somewhere else first. It is best-effort — under
# genuine exhaustion the kernel can still reclaim here rather than OOM — which is
# what we want. MemoryMin would be a hard guarantee and is deliberately not used;
# it pushes the OOM killer onto other cgroups instead.
#
# 6G against a ~7.2G footprint protects the working set without pinning cold
# pages, and imposes no ceiling at all.
[Slice]
MemoryLow=6G
