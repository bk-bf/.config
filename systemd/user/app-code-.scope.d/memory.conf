# Soft memory ceiling for VS Code (and the Claude Code extension host inside it).
#
# Context: on this 15.9 GB box, a long-lived Claude Code process grew its node
# heap until RAM + swap were both exhausted, triggering the global OOM killer.
# OOMPolicy=continue on wayland-wm@ now keeps the desktop alive through the kill,
# but the swap-thrash BEFORE the kill still froze the machine for a while.
#
# MemoryHigh is a SOFT limit: as this scope approaches 9G the kernel throttles it
# via aggressive reclaim (it slows down) rather than killing it. No hard kill, so
# no lost editor state. If it keeps growing past this it can still be OOM-killed
# at the system level, but the reclaim pressure buys time and curbs the thrash.
#
# This drop-in applies to every transient app-code-<pid>.scope (systemd matches
# drop-ins by the truncated "app-code-" prefix). Takes effect on next VS Code
# launch; run `systemctl --user set-property app-code-<pid>.scope MemoryHigh=9G`
# to apply to an already-running instance.
[Scope]
MemoryHigh=9G
