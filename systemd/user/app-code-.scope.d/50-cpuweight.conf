# CPU/IO priority: dev work yields to the desktop under contention.
#
# Context: background agents running tests inside VS Code (vitest workers at
# ~100% CPU each) starved the compositor's frame budget and pushed browser video
# from <1% to double-digit dropped frames. The decoder was never the victim —
# decode runs on the GPU video engine and is unaffected by CPU load. What starves
# is the CPU-side work that feeds the compositor: Gecko's render thread, the
# 120Hz composite, and the 8.3ms per-frame budget.
#
# Everything VS Code spawns lives in this scope — extension host, Claude Code
# extension, integrated-terminal shells, npm/npx, and vitest workers (verified:
# vitest PIDs resolve to app-code-<pid>.scope). So one weight here covers the
# entire dev workload class without naming individual tools.
#
# CPUWeight is PROPORTIONAL and only bites under contention. At 20 vs the default
# 100, dev work takes ~1/5 the share when something else wants the CPU, and still
# gets 100% of an otherwise idle machine. Interactive VS Code use is unaffected
# when nothing is competing — this is not a cap. Use CPUQuota for a hard ceiling;
# deliberately not doing that, since a quota would slow builds even on an idle box.
#
# IOWeight likewise keeps test runs from starving desktop reads under disk pressure.
#
# Applies to every transient app-code-<pid>.scope (systemd matches drop-ins by the
# truncated "app-code-" prefix). Takes effect on next VS Code launch; for a running
# instance: systemctl --user set-property app-code-<pid>.scope CPUWeight=20
[Scope]
CPUWeight=20
IOWeight=50
