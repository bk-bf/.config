# Let systemd-oomd act HERE, so it never has to act on the desktop.
#
# systemd-oomd watches PSI memory pressure and kills the worst offender inside a
# slice that opts in, before the kernel OOM killer gets involved. The kernel's
# killer picks by heuristic and has previously taken down desktop processes; see
# .docs/performance/CRASH_HISTORY_2026-07-23.md.
#
# Opting in app.slice and background.slice — and NOT session.slice — means the
# pressure relief lands on dev work and batch jobs, matching the CPU weights and
# session.slice's MemoryLow protection. A killed test runner is a re-run; a killed
# compositor is the session.
#
# 70% sustained (vs the 60% default) is deliberately less trigger-happy: it should
# fire only in genuinely bad territory, not during a heavy but healthy build.
#
# TRADE-OFF: this can kill a VS Code instance with unsaved editor state. It only
# happens under sustained severe pressure, and the alternative is the kernel
# choosing — which is how the desktop got taken down before.
#
# Requires the system service: sudo systemctl enable --now systemd-oomd
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=70%
