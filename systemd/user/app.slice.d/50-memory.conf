# Intentionally NO MemoryHigh on app.slice.
#
# A 6G cap was set here on 2026-07-28 00:16 and removed the same night after a
# session loss at 01:11. It was sized from a 1.7-2.0G idle reading, but app.slice
# reaches 3.4G within minutes of a fresh boot and goes far higher with vitest
# workers (~300MB each) plus a headless test browser (~167MB across 12 processes).
# The cap was therefore reachable in ordinary loaded use, not just under bloat --
# the opposite of what it was sized for.
#
# MemoryHigh does not kill, but it throttles via aggressive reclaim, and sustained
# reclaim on a cgroup pushes pages into zram. zram is compressed RAM, so filling it
# consumes physical RAM and tightens the very pressure the cap was meant to relieve.
# On a 15.9G machine with zram-only swap that feedback is not worth the benefit.
#
# The per-instance backstop that predates this is enough and stays:
#   app-code-.scope.d -> MemoryHigh=9G
#
# Desktop protection is the safe half of the policy and is unchanged:
#   session.slice.d/memory.conf -> MemoryLow=6G   (protection, never a ceiling)
#
# CAUSATION NOT PROVEN: no kernel OOM, no cgroup OOM and no systemd-oomd kill was
# logged for that session loss. This is removed because it is the riskiest recent
# change and its benefit was speculative, not because it was shown to be the cause.
[Slice]
MemoryHigh=infinity
