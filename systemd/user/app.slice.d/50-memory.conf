# Soft memory ceiling for app workloads, sized so only bloat ever reaches it.
#
# Counterpart to session.slice's MemoryLow=6G: protection there, throttling here.
# Under memory pressure the kernel now reclaims from dev work — where being slowed
# costs nothing — instead of from the compositor and browser.
#
# Sizing is deliberate. app.slice sits at ~2.0G in normal use (VS Code UI, its
# renderer, idle dbus daemons). At 6G the throttle is 3x headroom above that, so
# ordinary editing never approaches it and the UI is never reclaimed against.
# What does reach 6G is the background work — extension host growth, language
# servers, node test workers holding heaps. That is the intended target.
#
# MemoryHigh throttles via reclaim pressure; it never kills. app-code-.scope.d
# keeps its own MemoryHigh=9G as a per-instance backstop above this aggregate one.
#
# CAVEAT — this cannot perfectly separate VS Code's UI from its background work,
# because both live in the same app-code-<pid>.scope and cgroup limits apply to
# the whole cgroup. The headroom above is what keeps the UI clear of the limit in
# practice. For a true split, launch heavy jobs into a different cgroup:
#   systemd-run --user --slice=background.slice --scope -- npx vitest run
[Slice]
MemoryHigh=6G
