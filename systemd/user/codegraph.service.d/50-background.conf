# Batch work — yields to the desktop under contention.
#
# background.slice carries systemd's default CPUWeight=30 versus 100 elsewhere,
# so these units give way when the compositor, browser or an interactive terminal
# wants the CPU. Weights bind only under contention: on an idle machine these run
# at full speed, and none of them is latency-sensitive enough for that to matter.
[Service]
Slice=background.slice
