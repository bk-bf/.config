# Drop-in for the package-owned cachyos-rate-mirrors.service.
#
# The timer is Persistent=true, so a due date that falls inside a suspend window
# starts the service the moment the machine wakes. At that point
# network-online.target is still active from before the suspend, so the unit's
# After= ordering gates nothing and NetworkManager has not reconnected yet. The
# script's first command resolves geoip.kde.org, and under set -e a failed
# lookup ends the run before any mirror list is rewritten.
#
# nm-online blocks until NetworkManager reports connectivity; the restart covers
# the case where DNS is still settling once it returns.

[Unit]
StartLimitIntervalSec=1800
StartLimitBurst=5

[Service]
ExecStartPre=/usr/bin/nm-online -q -t 180
Restart=on-failure
RestartSec=300
