# Dynamically set GRUB_TOP_LEVEL to the highest-versioned
# vmlinuz-cachyos-galaxybook* kernel found in /boot.
#
# Sourced by grub-mkconfig from /etc/default/grub.d/ — runs in grub-mkconfig's
# own shell, so GRUB_TOP_LEVEL is visible to 10_linux before it executes.

_best=""
_best_ver=""

for _vmlinuz in /boot/vmlinuz-cachyos-galaxybook*; do
    [ -f "$_vmlinuz" ] || continue
    _ver="${_vmlinuz#/boot/vmlinuz-cachyos-galaxybook}"

    if [ -z "$_best" ]; then
        _best="$_vmlinuz"
        _best_ver="$_ver"
        continue
    fi

    _highest=$(printf '%s\n%s\n' "$_ver" "$_best_ver" | sort -V -r | head -n1)
    if [ "$_highest" = "$_ver" ] && [ "$_ver" != "$_best_ver" ]; then
        _best="$_vmlinuz"
        _best_ver="$_ver"
    fi
done

[ -n "$_best" ] && GRUB_TOP_LEVEL="$_best"

unset _best _best_ver _vmlinuz _ver _highest
