# Simple bookmarks using cd command
[[mgr.prepend_keymap]]
on = [ "<C-S-r>" ]
run = "quit"
desc = "Quit yazi (restart to reload config)"

[[mgr.prepend_keymap]]
on = [ "b" ]
run = "shell -- ~/.config/yazi/add-bookmark.sh $PWD"
desc = "Add current directory as bookmark"

[[mgr.prepend_keymap]]
on = [ "g", "c" ]
run = "cd ~/.config"
desc = "Go to ~/.config"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run = "cd ~/Downloads"
desc = "Go to ~/Downloads"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = "cd ~/Documents"
desc = "Go to ~/Documents"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = "cd ~/Pictures"
desc = "Go to ~/Pictures"

[[mgr.prepend_keymap]]
on = [ "g", "v" ]
run = "cd ~/Videos"
desc = "Go to ~/Videos"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = "cd ~/Music"
desc = "Go to ~/Music"

[[mgr.prepend_keymap]]
on = [ "g", "1" ]
run = "cd ~/Documents/Obsidian/Knowledge/Study/Math/Books"
desc = "Go to ~/Documents/Obsidian/Knowledge/Study/Math/Books"


[[mgr.prepend_keymap]]
on = [ "g", "a" ]
run = "cd /home/kirill/Documents/Obsidian"
desc = "Go to /home/kirill/Documents/Obsidian"
