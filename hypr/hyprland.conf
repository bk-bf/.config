################################################################################
#                            HYPRLAND CONFIGURATION                            #
################################################################################

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                            CORE VARIABLES                                 ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

$mod   = SUPER
$term  = kitty
$menu  = qs -c noctalia-shell ipc call launcher toggle
$plugins = ~/.local/lib/hyprland-plugins


# Vim-style direction keys
$left  = h
$down  = j
$up    = k
$right = l

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                              MONITOR                                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Desktop dual-monitor layout (this device: AMD RX 5700 XT)
# HP E243i on DisplayPort = primary (left); LG on HDMI = right.
monitor = DP-3,     1920x1200@60, 0x0,    1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         APPEARANCE & LAYOUT                               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

general {
    border_size       = 0
    gaps_in           = 0
    gaps_out          = 0
    layout            = scrolling
    resize_on_border  = true   # hold $mod + drag border to resize (replaces floating_modifier drag)
}

scrolling {
    explicit_column_widths = 0.333, 0.5, 1.0
}

decoration {
    rounding          = 0
    rounding_power    = 2

    blur {
        enabled       = true
        size          = 3
        passes        = 2
        vibrancy      = 0.1696
    }

    shadow {
        enabled       = true
        range         = 4
        render_power  = 3
        color         = rgba(1a1a1aee)
    }
}

cursor {
    inactive_timeout  = 3      # hide cursor after 3s of inactivity (was: seat * hide_cursor 3000)
    no_warps          = false
}

misc {
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    disable_autoreload       = true
    vrr                      = 0     # adaptive sync disabled — fixes Chromium video frame pacing
}

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                              ANIMATIONS                                   ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = false

    bezier = easeOut,    0.16, 1, 0.3, 1
    bezier = easeInOut,  0.4, 0, 0.2, 1
    bezier = overshot,   0.05, 0.9, 0.1, 1.1

    animation = windows,     1, 2,  overshot, slide
    animation = windowsOut,  1, 2,  easeOut,  slide
    animation = border,      1, 3,  easeInOut
    animation = fade,        1, 2,  easeOut
    animation = workspaces,  1, 3,  easeInOut, slidevert
}

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                          INPUT CONFIGURATION                              ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

input {
    kb_layout = de
    # touchpad block removed — desktop (Logitech G213 keyboard + G502 mouse)
}

# ── Touchpad gestures removed — no touchpad on this desktop ──

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         ESSENTIAL KEYBINDINGS                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Terminal & Application Launcher
bind = $mod,  Return, exec, $term
binds = Control_R, Return, exec, $term
bind = $mod,  D,      exec, $menu
bind = $mod, P, exec, firefox --no-remote -P perplexity --new-window https://www.perplexity.ai


# Window Management
bind = $mod,       Q,     killactive
bind = $mod SHIFT, F,     fullscreen,     0

bind = $mod SHIFT, space, togglefloating
bind = $mod SHIFT, T,     exec, ~/.config/hypr/scripts/toggle-opacity.sh

# Mouse bindings for floating windows
bindm = $mod, mouse:272, movewindow    # hold mod + left-click drag to move

# Frequently Used Apps
bind = $mod,       N,     exec, nautilus
bind = $mod,       C,     exec, qs -c noctalia-shell ipc call launcher clipboard


# Screenshots (saved to ~/Downloads and clipboard)
bind = ,       Print, exec, grim -g "$(slurp)" - | tee ~/Downloads/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy --type image/png && notify-send "Screenshot" "Area screenshot saved to clipboard"
bind = SHIFT,  Print, exec, grim - | tee ~/Downloads/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy --type image/png && notify-send "Screenshot" "Fullscreen screenshot saved to clipboard"
bind = CTRL,   Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | tee ~/Downloads/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy --type image/png && notify-send "Screenshot" "Window screenshot saved to clipboard"

# System Controls
bind = $mod SHIFT, L,      exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mod SHIFT, R,      exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"
bind = $mod SHIFT, E,      exec, hyprctl dispatch exit

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                        WORKSPACE MANAGEMENT                               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Switch workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move container to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                       WINDOW NAVIGATION & FOCUS                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Move focus — vim keys
bind = $mod, $left,  layoutmsg, focus left
bind = $mod, $down,  layoutmsg, focus down
bind = $mod, $up,    layoutmsg, focus up
bind = $mod, $right, layoutmsg, focus right

# Move focus — arrow keys (left/right) + workspace switch (up/down)
bind = $mod, left,   layoutmsg, focus left
bind = $mod, right,  layoutmsg, focus right
bind = $mod SHIFT, up,     workspace, r-1
bind = $mod SHIFT, down,   workspace, r+1

# Move window — vim keys
bind = $mod SHIFT, $left,  movewindow, l
bind = $mod SHIFT, $down,  movewindow, d
bind = $mod SHIFT, $up,    movewindow, u
bind = $mod SHIFT, $right, movewindow, r

# Move window — arrow keys (left/right); skip empty workspaces (up/down)
bind = $mod SHIFT, left,   movewindow, l
bind = $mod SHIFT, right,  movewindow, r
bind = $mod, up,     workspace, e-1
bind = $mod, down,   workspace, e+1

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                          LAYOUT MANAGEMENT                                ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Gaps adjustment (runtime — survives until reload)
bind = $mod,       Z, exec, hyprctl keyword general:gaps_in $(($(hyprctl getoption general:gaps_in | awk 'NR==1{print $2}')+1))
bind = $mod SHIFT, Z, exec, hyprctl keyword general:gaps_in $(($(hyprctl getoption general:gaps_in | awk 'NR==1{print $2}')-1))

# Column width — cycle 1/3 → 1/2 → full, with notification
bind = $mod, F, exec, hyprctl dispatch layoutmsg "colresize +conf" && W=$(hyprctl activewindow -j | jq .size[0]) && MON=$(hyprctl monitors -j | jq -r '.[0] | (.width / .scale | floor)') && FRAC=$(echo "$W $MON" | awk '{printf "%.0f%%", $1/$2*100}') 

# Toggle layout: scrolling ↔ dwindle (runtime only, resets on reload)
bind = $mod, T, exec, LAYOUT=$(hyprctl getoption general:layout | awk '/str:/{print $3}'); if [ "$LAYOUT" = "scrolling" ]; then hyprctl keyword general:layout dwindle && notify-send -u low "Layout" "Dwindle"; else hyprctl keyword general:layout scrolling && notify-send -u low "Layout" "Scrolling"; fi

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                       SCRATCHPAD & RESIZE MODE                            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Scratchpad
bind = $mod SHIFT, minus, movetoworkspace,       special
bind = $mod,       minus, togglespecialworkspace

# Resize submap (replaces sway resize mode)
bind = $mod, R, submap, resize

submap = resize
binde = , $left,  resizeactive, -10 0
binde = , $down,  resizeactive, 0 10
binde = , $up,    resizeactive, 0 -10
binde = , $right, resizeactive, 10 0
binde = , left,   resizeactive, -10 0
binde = , down,   resizeactive, 0 10
binde = , up,     resizeactive, 0 -10
binde = , right,  resizeactive, 10 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
submap = reset

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         HARDWARE KEYS                                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# bindl = fires even on lockscreen (replaces --locked)
# swayosd disabled — replace with Noctalia OSD commands if needed
bindl = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindl = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# brightness keys removed — external desktop monitors have no backlight control

# (middle-click paste left enabled — useful with a mouse on desktop)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                          WINDOW RULES                                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Assign applications to specific workspaces
# silent = don't switch to the workspace when the app opens at startup

# windowrule = workspace 1 silent, match:class ^(code-url-handler)$
# windowrule = workspace 3 silent, match:class ^(zen)$

# zen browser flickering fix attempt
#windowrule = opacity 0.99999 0.99999, match:class ^(zen)$

 # YouTube (Helium PWA) — hide topbar
 windowrule = decorate off, match:class ^(chrome-agimnkijcaahngcdmfeangaknmldooml-Default)$

# for perplexity web app hack 
# Make only the tagged Perplexity window translucent
windowrule = match:class ^(PerplexityApp)$, opacity 1.0 1.0

# kitty transparency — baseline 0.7 (migrated from i3/picom: opacity-rule 70% for kitty).
# Toggled by hypr/scripts/toggle-opacity.sh (bound to Mod+Shift+T).
# Transparency is owned entirely by Hyprland (kitty's background_opacity is unset).
# The windowrule sets active opacity to 0.7 at spawn.
# The toggle script uses `hyprctl dispatch setprop` at PRIORITY_SET_PROP (higher), so it wins.
# It sets both opacity+opacity_override and opacity_inactive+opacity_inactive_override each call.
# State is tracked via /tmp/hypr-opacity-<addr>: absent = transparent (default), present = opaque.
# First press on a fresh window (no state file) always goes opaque — this is intentional.
windowrule = opacity 0.7 override, match:class ^(kitty)$

# Disable blur for Helium browser — blur + 2x scale compositing causes dropped video frames
windowrule = no_blur on, match:class ^(helium)$
windowrule = float on, match:class ^(mpv)$

# Zen Browser Picture-in-Picture — float, pin to all workspaces, anchor upper-right
windowrule = float on,        match:title ^(Picture-in-Picture)$
windowrule = pin on,          match:title ^(Picture-in-Picture)$
windowrule = move 2440 30,    match:title ^(Picture-in-Picture)$


# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                        ENVIRONMENT & AUTOSTART                            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# gtk3 platform theme plugin (libqgtk3.so) reads ~/.config/gtk-3.0/settings.ini
# which has gtk-icon-theme-name=Papirus — this is what worked before with GDM
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, gtk3
env = LIBVA_DRIVER_NAME, radeonsi   # AMD RX 5700 XT VAAPI (was iHD for Intel laptop)

# Wayland / Hyprland environment
# UWSM handles env propagation and graphical-session.target activation before
# the compositor starts — these lines are redundant but harmless under UWSM.
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP

# OSD server — disabled; Noctalia shell provides its own OSD
# exec-once = systemctl --user start swayosd.service

# Credential management
# polkit agent runs as systemd user service (polkit-agent.service) with auto-restart
exec-once = gnome-keyring-daemon --start --components=secrets

# System tray applets
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hustle_daemon

# Clipboard history daemon (two typed watchers required by Noctalia)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Clipboard copy notification (1s, low urgency)
exec-once = wl-paste --type text --watch ~/.config/hypr/scripts/cliphist-store.sh
exec-once = wl-paste --type image --watch ~/.config/hypr/scripts/cliphist-store.sh

# Battery monitor removed — desktop has no battery

# Sleep / lid switch handler (replaces swayidle)
exec-once = hypridle

# Wallpaper
plugin {
    scroller {
        center_active_column = true
    }

}


# WALLPAPER NOTE: wallpaper is managed by Noctalia shell — do NOT set it here.
# If instructed to change the wallpaper, notify the user to set it manually in Noctalia instead.
exec-once = hyprpaper

# Status bar (QT_QPA_PLATFORMTHEME=qt6ct set globally above — qt6ct.conf has icon_theme=Papirus)
exec-once = qs -c noctalia-shell

# Workspace/window session restore (hyprflow, AUR). Re-launches apps on their
# workspaces from the last autosave. --max-age skips stale sessions (>24h).
# Autosave runs via the hyprflow systemd timer (hyprflow autosave --install).
exec-once = hyprflow restore --max-age 24h

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                       APPLICATION AUTO-START                              ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


