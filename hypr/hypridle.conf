general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock

    # Locks the session before suspend (skipped if a fullscreen window is active)
    before_sleep_cmd = bash ~/.config/hypr/scripts/idle-action.sh before-sleep

    after_sleep_cmd = hyprctl dispatch dpms on
}

# Turn off display after 20 minutes of inactivity.
# Skipped if fullscreen video or active audio is detected.
listener {
    timeout   = 1200
    on-timeout = bash ~/.config/hypr/scripts/idle-action.sh screen-off
    on-resume  = hyprctl dispatch dpms on
}

# Lock screen after 11 minutes of inactivity.
# Skipped if fullscreen video or active audio is detected.
listener {
    timeout   = 660
    on-timeout = bash ~/.config/hypr/scripts/idle-action.sh lock
}

# Suspend after 30 minutes of inactivity.
# Skipped if fullscreen video or active audio is detected.
listener {
    timeout   = 1800
    on-timeout = bash ~/.config/hypr/scripts/idle-action.sh suspend
}
