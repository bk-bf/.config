general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock

    # Locks the session before suspend (skipped if a fullscreen window is active)
    before_sleep_cmd = bash ~/.config/hypr/scripts/idle-action.sh before-sleep

    after_sleep_cmd = hyprctl dispatch dpms on
}

# Desktop device: aggressive inactivity monitor-off and suspend are disabled.
# This is a desktop (dual DP-3 + HDMI-A-1, always on AC) — no battery to save,
# so blanking the displays and suspending on idle is unwanted. Re-enable the
# two listeners below if migrating this branch back to a laptop.

# Turn off display after 4 minutes of inactivity. (disabled on desktop)
# Skipped if fullscreen video or active audio is detected.
# listener {
#     timeout   = 240
#     on-timeout = bash ~/.config/hypr/scripts/idle-action.sh screen-off
#     on-resume  = hyprctl dispatch dpms on
# }

# Lock screen after 11 minutes of inactivity.
# Skipped if fullscreen video or active audio is detected.
listener {
    timeout   = 660
    on-timeout = bash ~/.config/hypr/scripts/idle-action.sh lock
}

# Suspend after 30 minutes of inactivity. (disabled on desktop)
