
set -g allow-passthrough all

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g aggressive-resize off
set -sg escape-time 0
set -as terminal-features ",*:sync"
set -g focus-events on
set -g history-limit 1000000

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g destroy-unattached off
set -g set-clipboard on
setw -g mode-keys vi

thm_bg="#1e1e2e"
thm_gray="#313244"
thm_fg="#cdd6f4"
thm_mauve="#cba6f7"
thm_blue="#a3b4eb"
thm_orange="#fab387"
thm_black="#11111b"

set -g status off
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=${thm_bg}"
set -g status-left-length  120
set -g status-right-length 120

set -g status-left ""

set -g status-right \
  "#[fg=${thm_orange},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_black},bg=${thm_orange}]  #{b:pane_current_path} "

set -g window-status-separator ""

set -g window-status-format \
  "#[fg=${thm_bg},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}] #I #[fg=${thm_gray},bg=${thm_bg}] #[fg=${thm_fg},bg=${thm_bg}]#W  "

set -g window-status-current-format \
  "#[fg=${thm_bg},bg=${thm_bg}]#[fg=${thm_black},bg=${thm_mauve}] #I #[fg=${thm_mauve},bg=${thm_gray}]#[fg=${thm_fg},bg=${thm_gray}] #W#{?window_zoomed_flag, ,} #[fg=${thm_gray},bg=${thm_bg}]"

bind-key -n M-w if-shell \
  '[ "$(tmux show -gqv window-status-format)" = "" ]' \
  'set -g window-status-format "#[fg=#1e1e2e,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #I #[fg=#313244,bg=#1e1e2e] #[fg=#cdd6f4,bg=#1e1e2e]#W  " ; set -g window-status-current-format "#[fg=#1e1e2e,bg=#1e1e2e]#[fg=#11111b,bg=#cba6f7] #I #[fg=#cba6f7,bg=#313244]#[fg=#cdd6f4,bg=#313244] #W#{?window_zoomed_flag, ,} #[fg=#313244,bg=#1e1e2e]"' \
  'set -g window-status-format "" ; set -g window-status-current-format ""'

set -g pane-active-border-style "fg=${thm_mauve},bg=default"
set -g pane-border-style        "fg=${thm_gray},bg=default"

set -g mode-style "fg=${thm_black},bg=${thm_mauve}"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

bind c new-window -c "$HOME"

bind X confirm-before -p "Force kill window #W? (y/n)" kill-window

bind e neww -c "$HOME" "nvim ." \; rename-window "nvim"

bind . neww -c "$HOME/.config" \; rename-window ".config"

bind p neww -c "$HOME/Documents/Projects" \; rename-window "projects"

bind o neww -c "$HOME/Documents/Obsidian" \; rename-window "obsidian"

bind d neww -c "$HOME/Downloads" \; rename-window "downloads"

bind s neww "ssh -t ubuntu" \; rename-window "ubuntu"

bind g neww -c "$HOME" \
  "fd --type f --hidden --exclude .git 2>/dev/null \
   | fzf --prompt='  file  ' --border=rounded --height=90% --layout=reverse \
         --preview 'bat --color=always {}' \
   | xargs -r nvim" \; rename-window "find"


set -g mouse on

bind-key -n M-]   next-window
bind-key -n M-[   previous-window
bind-key -n M-1   run "tmux select-window -t 1 2>/dev/null || tmux new-window -t 1 -c '$HOME'"
bind-key -n M-2   run "tmux select-window -t 2 2>/dev/null || tmux new-window -t 2 -c '$HOME'"
bind-key -n M-3   run "tmux select-window -t 3 2>/dev/null || tmux new-window -t 3 -c '$HOME'"
bind-key -n M-4   run "tmux select-window -t 4 2>/dev/null || tmux new-window -t 4 -c '$HOME'"
bind-key -n M-5   run "tmux select-window -t 5 2>/dev/null || tmux new-window -t 5 -c '$HOME'"
bind-key -n M-6   run "tmux select-window -t 6 2>/dev/null || tmux new-window -t 6 -c '$HOME'"
bind-key -n M-7   run "tmux select-window -t 7 2>/dev/null || tmux new-window -t 7 -c '$HOME'"
bind-key -n M-8   run "tmux select-window -t 8 2>/dev/null || tmux new-window -t 8 -c '$HOME'"
bind-key -n M-9   run "tmux select-window -t 9 2>/dev/null || tmux new-window -t 9 -c '$HOME'"

bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n C-h     select-pane -L
bind-key -n C-l     select-pane -R
bind-key -n C-k     select-pane -U
bind-key -n C-j     select-pane -D

bind-key -n M-v   split-window -h -c "#{pane_current_path}"
bind-key -n M-h   split-window -v -c "#{pane_current_path}"
unbind-key -n M-S-q
bind-key -n M-Q   kill-pane
bind-key -n M-w   set -g status

bind-key -n M-d display-popup -E -w 60% -h 60% \
  "sesh connect \$(sesh list --icons | fzf \
    --prompt='  session  ' \
    --border=rounded \
    --height=100% \
    --layout=reverse \
    --info=hidden \
    --ansi \
    --no-sort \
    --bind 'ctrl-q:execute-silent(tmux kill-session -t \$(echo {} | awk \"{print \\\$NF}\"))+reload(sesh list --icons)')"

bind-key -n M-i neww -c "$HOME" "nvim ~/.config/tmux/tmux.conf" \; rename-window "tmux help"
