# Power Limits: Balanced mode (default)
# PL2 (short-term burst): 25W | PL1 (long-term sustained): 15W
# Stock thermald-managed operation

enable no

undervolt 0 'CPU' 0
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' 0
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0

power package 25 15

interval 5000

daemon undervolt:once
daemon power
daemon tjoffset
