# Power Limits: Performance mode
# PL2 (short-term burst): 45W | PL1 (long-term sustained): 28W (stock TDP)
# Full turbo envelope — thermald still active as thermal safety net

enable no

undervolt 0 'CPU' 0
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' 0
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0

power package 45 28

interval 5000

daemon undervolt:once
daemon power
daemon tjoffset
